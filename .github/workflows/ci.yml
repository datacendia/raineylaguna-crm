# CI for raineylaguna-crm
#
# Per rainey-stack/CONVENTIONS.md §13.5 (Day 1 AM):
#   "GitHub Actions: typecheck + lint + build on PR" for every Next.js repo.
#
# This workflow gates pull requests with four checks:
#   1. lint      — `next lint` against ESLint 10 + eslint-config-next 16
#   2. typecheck — `tsc --noEmit` against TypeScript 5.6, strict mode
#   3. test      — `vitest run` (unit tests, including priority-score)
#   4. build     — full production `next build`
#
# Build runs without runtime env vars set. The CRM reads DATABASE_URL,
# REDIS_URL, CRM_COOKIE_SECRET, and CRM_LEAD_INTAKE_SECRET at request time,
# not at build time, so this is safe. If you add a feature that reads env
# at module top-level, either lazy-evaluate it or add a placeholder under
# the `env:` block in the build step.
#
# Failing the workflow blocks merge. Add a branch protection rule on `main`
# that requires this workflow to pass before merge.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a newer commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # `npm install` instead of `npm ci` because package-lock.json drifted
        # from package.json (see vigiaV2 fix/ci-npm-install PR #6 for the same
        # pattern). Determinism via setup-node cache; self-heals drift.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint (next lint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test (vitest run)
        run: npm test

      - name: Build (next build)
        run: npm run build
        env:
          # Build-time placeholders. The CRM does no DB/Redis I/O during
          # `next build`; these exist so any zod env loaders that *do*
          # evaluate at module top-level don't trip CI. Real values are
          # injected at runtime by Railway.
          SKIP_ENV_VALIDATION: '1'
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          REDIS_URL: 'redis://localhost:6379'
          CRM_COOKIE_SECRET: 'ci-placeholder-cookie-secret-32-chars-min'
          CRM_LEAD_INTAKE_SECRET: 'ci-placeholder-lead-intake-secret'

  e2e:
    name: e2e (auth gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only the specs that are honest without a database run here.
    #
    #   auth-gating.spec.ts — asserts unauthenticated requests are refused, so
    #     it needs no session and no seeded data. This is the regression test
    #     for src/proxy.ts's matcher: a lead-reading route missing from that
    #     list is an unauthenticated data leak, and nothing else catches it.
    #   api-health.spec.ts  — accepts 200 or 503 by design, so an unreachable
    #     DB is a pass rather than a flake.
    #
    # admin-login.spec.ts and dashboard-nav.spec.ts need a real database and a
    # seeded admin user, so they stay local until CI grows a Postgres service.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run auth-gating + health e2e
        # Playwright's webServer block starts `npm run dev` and waits for it.
        run: npx playwright test e2e/auth-gating.spec.ts e2e/api-health.spec.ts --project=chromium
        env:
          CI: '1'
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          REDIS_URL: 'redis://localhost:6379'
          CRM_COOKIE_SECRET: 'ci-placeholder-cookie-secret-32-chars-min'
          CRM_LEAD_INTAKE_SECRET: 'ci-placeholder-lead-intake-secret'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
